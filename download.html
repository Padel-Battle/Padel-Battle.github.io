<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0d1b2a" />
  <meta name="description" content="Download Padel Battle for iPhone or Android. Organise your next padel tournament and share the results with friends." />
  <meta property="og:title" content="Get Padel Battle" />
  <meta property="og:description" content="Your players. Your courts. Your next padel night. Available on the App Store and Google Play." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://padel-battle.github.io/download.html" />
  <meta property="og:image" content="https://padel-battle.github.io/app-icon.png" />
  <link rel="canonical" href="https://padel-battle.github.io/download.html" />
  <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
  <title>Get Padel Battle</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; padding: 32px 20px; display: grid; place-items: center; background: #f4f7f6; color: #0d1b2a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 420px; padding: 36px 28px 28px; border: 1px solid #dce6e2; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 12px 40px #0d1b2a0a; }
    .app-icon { display: block; width: 88px; height: 88px; margin: 0 auto 24px; border-radius: 20px; }
    .brand { display: flex; justify-content: center; align-items: center; gap: 7px; margin: 0 0 14px; color: #28796c; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    .brand::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #28796c; }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 7vw, 34px); line-height: 1.15; letter-spacing: -1px; overflow-wrap: break-word; }
    .description { margin: 0 0 24px; color: #53636b; font-size: 16px; line-height: 1.5; }
    .stores { display: grid; gap: 12px; }
    .store { display: flex; justify-content: center; align-items: center; gap: 12px; min-height: 66px; padding: 12px 20px; border: 1px solid #0d1b2a; border-radius: 13px; color: #fff; background: #0d1b2a; text-decoration: none; }
    .store svg { flex: 0 0 28px; width: 28px; height: 28px; fill: currentColor; }
    .store span { text-align: start; }
    .store small { display: block; font-size: 12px; line-height: 1.4; }
    .store strong { display: block; font-size: 23px; line-height: 1.2; font-weight: 600; }
    .store:hover { background: #1b3444; }
    a:focus-visible { outline: 3px solid #28796c; outline-offset: 4px; }
    .status { margin: 20px 0 0; color: #53636b; font-size: 13px; line-height: 1.5; }
    .home { display: inline-block; margin-top: 20px; color: #28796c; font-size: 13px; text-underline-offset: 3px; }
    @media (max-width: 360px) { main { padding: 28px 20px 24px; } }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <img class="app-icon" src="/app-icon.webp" width="88" height="88" alt="" />
    <p class="brand">PADEL BATTLE</p>
    <h1 id="title">Get Padel Battle</h1>
    <p class="description" id="description">Less organising. More padel.</p>
    <div class="stores" id="stores" aria-label="Download Padel Battle">
      <a class="store" id="app-store" href="https://apps.apple.com/app/id6775545020">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.4c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.39-1.32 2.76-2.53 3.99zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" /></svg>
        <span><small id="apple-label">Download on the</small><strong>App Store</strong></span>
      </a>
      <a class="store" id="google-play" href="https://play.google.com/store/apps/details?id=com.courtflow.padelbattle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2.5v19l10-9.5L3 2.5zm1.7-.9 11.8 6.8-2.3 2.2L4.7 1.6zm12.9 7.5 3 1.7c.9.5.9 1.9 0 2.4l-3 1.7-3.1-2.9 3.1-2.9zm-3.4 4.3 2.3 2.2-11.8 6.8 9.5-9z" /></svg>
        <span><small id="google-label">Get it on</small><strong>Google Play</strong></span>
      </a>
    </div>
    <p class="status" id="status" role="status">Choose the store for your phone.</p>
    <a class="home" id="home" href="/">Visit our website</a>
  </main>
  <script>
    (() => {
      const translations = {
        en: ["Get Padel Battle", "Less organising. More padel.", "Download on the", "Get it on", "Choose the store for your phone.", "Opening your store… If it doesn't open, tap a button above.", "Visit our website"],
        uk: ["Завантажити Padel Battle", "Менше організації. Більше паделу.", "Завантажити в", "Завантажити в", "Виберіть магазин для свого телефона.", "Відкриваємо магазин… Якщо він не відкрився, натисніть кнопку вище.", "Перейти на сайт"],
        pl: ["Pobierz Padel Battle", "Mniej organizowania. Więcej padla.", "Pobierz w", "Pobierz z", "Wybierz sklep dla swojego telefonu.", "Otwieramy sklep… Jeśli się nie otworzy, użyj przycisku powyżej.", "Odwiedź naszą stronę"],
        es: ["Descarga Padel Battle", "Menos organización. Más pádel.", "Descárgalo en", "Disponible en", "Elige la tienda para tu teléfono.", "Abriendo la tienda… Si no se abre, pulsa un botón de arriba.", "Visita nuestra web"],
        de: ["Padel Battle herunterladen", "Weniger organisieren. Mehr Padel.", "Laden im", "Jetzt bei", "Wähle den Store für dein Smartphone.", "Dein Store wird geöffnet… Falls nicht, tippe oben auf eine Schaltfläche.", "Unsere Website besuchen"],
        pt: ["Descarregar Padel Battle", "Menos organização. Mais padel.", "Descarregar na", "Obter no", "Escolhe a loja para o teu telemóvel.", "A abrir a loja… Se não abrir, toca num dos botões acima.", "Visitar o nosso site"],
        ar: ["تنزيل Padel Battle", "تنظيم أقل. بادل أكثر.", "تنزيل من", "احصل عليه من", "اختر المتجر المناسب لهاتفك.", "جارٍ فتح المتجر… إذا لم يفتح، اضغط على أحد الزرين أعلاه.", "زيارة موقعنا"],
      };
      const languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
      const language = languages.map(value => value.toLowerCase().split("-")[0]).find(value => Object.prototype.hasOwnProperty.call(translations, value)) || "en";
      const copy = translations[language];
      document.documentElement.lang = language;
      document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
      document.title = copy[0];
      ["title", "description", "apple-label", "google-label", "status", "home"].forEach((id, index) => {
        document.getElementById(id).textContent = copy[index === 5 ? 6 : index];
      });
      document.getElementById("stores").setAttribute("aria-label", copy[0]);

      const userAgent = navigator.userAgent || "";
      // Link-preview crawlers should see the page rather than follow a store redirect.
      if (/bot|crawler|spider|facebookexternalhit|preview/i.test(userAgent)) return;
      // A manual choice is useful when a browser hides or changes the device identity.
      if (new URLSearchParams(location.search).has("choose")) return;

      const platform = navigator.userAgentData ? navigator.userAgentData.platform : "";
      const isAndroid = platform === "Android" || /Android/i.test(userAgent);
      const isIOS = platform === "iOS" || /iPad|iPhone|iPod/i.test(userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const store = isAndroid ? "google-play" : isIOS ? "app-store" : null;
      if (!store) return;

      document.getElementById("status").textContent = copy[5];
      try {
        location.replace(document.getElementById(store).href);
      } catch (_) {
        document.getElementById("status").textContent = copy[4];
      }
    })();
  </script>
</body>
</html>
